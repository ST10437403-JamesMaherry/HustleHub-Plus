server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache fingerprinted Vite bundles but return 404 for missing assets.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Refresh HTML normally so deployments can update asset references.
    location = /index.html {
        expires -1;
    }

    # Client-side routes must load the SPA entry point on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
