sonar.projectKey=hustlehub-plus_insy7314poe
sonar.organization=st10257942
sonar.projectName=HustleHub+
sonar.sourceEncoding=UTF-8

# Application code: the Express API and the React client.
sonar.sources=api,client/src
sonar.tests=api/test,client/src/test

# Test folders are analysed as tests, so they are left out of the sources. Nothing else is excluded
# except dependencies and generated output.
sonar.exclusions=api/test/**,client/src/test/**,**/node_modules/**,**/coverage/**,**/dist/**

# Produced by "npm run test:coverage" in api and in client.
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,client/coverage/lcov.info

# Fail the scan when the quality gate fails, so CI cannot pass on a failing gate.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
